[package]
name = "kiosquito-flow-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid", "rust_decimal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["db-postgres", "serde", "serde-with-float"] }
argon2 = "0.6.0"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
bcrypt = "0.19.3"
